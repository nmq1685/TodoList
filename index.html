<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Quản lý công việc</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <i class="fas fa-tasks"></i>
                To-Do List
            </h1>
            <p class="subtitle">Quản lý công việc hiệu quả</p>
        </header>

        <div class="todo-container">
            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="todoInput" placeholder="Nhập công việc mới..." maxlength="100">
                    <button id="addBtn" class="add-btn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="filter-section">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i> Tất cả
                    </button>
                    <button class="filter-btn" data-filter="pending">
                        <i class="fas fa-clock"></i> Chưa hoàn thành
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-check"></i> Đã hoàn thành
                    </button>
                </div>
            </div>

            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">Tổng số</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="pendingTasks">0</span>
                    <span class="stat-label">Chưa xong</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">Đã xong</span>
                </div>
            </div>

            <div class="todo-list" id="todoList">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>Chưa có công việc nào</h3>
                    <p>Hãy thêm công việc đầu tiên của bạn!</p>
                </div>
            </div>

            <div class="actions-section">
                <button id="clearCompleted" class="action-btn clear-btn">
                    <i class="fas fa-trash"></i>
                    Xóa đã hoàn thành
                </button>
                <button id="clearAll" class="action-btn danger-btn">
                    <i class="fas fa-trash-alt"></i>
                    Xóa tất cả
                </button>
            </div>
        </div>
    </div>

    <!-- Modal xác nhận -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Xác nhận</h3>
            <p id="confirmMessage">Bạn có chắc chắn muốn thực hiện hành động này?</p>
            <div class="modal-actions">
                <button id="confirmYes" class="btn-confirm">Có</button>
                <button id="confirmNo" class="btn-cancel">Không</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
